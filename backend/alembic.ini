# Alembic is used from the beginning so a later PostgreSQL migration is
# controlled rather than improvised. See docs/LOCAL_SETUP.md.

[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is read from .env by alembic/env.py; this value is a placeholder so
# the file is valid without a .env present.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
