name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  ml:
    name: ML — SVI engine & detector tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements-ci.txt   # light deps only — no torch in CI
          pip install ruff pytest
      - name: Lint
        run: ruff check svi/ nlp/ acoustics/
      - name: Test SVI engine (must never regress)
        run: pytest svi/ -q
      - name: Test detectors
        run: pytest nlp/ -q

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  guardrails:
    name: Guardrails — secrets & forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed secrets
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.example' ':!.github/workflows/*'; then
            echo "::error::Possible secret committed. Remove it AND rotate the key."
            exit 1
          fi
      - name: Block .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|prod|production)$'; then
            echo "::error::.env committed. Use .env.example instead."
            exit 1
          fi
      - name: Block audio, video and model weights
        run: |
          if git ls-files | grep -iE '\.(wav|mp3|m4a|flac|ogg|webm|mp4|pt|bin|safetensors|ckpt|onnx)$'; then
            echo "::error::Media or model weights committed. Keep them in shared storage; commit the manifest only."
            exit 1
          fi
      - name: Block large files (>5 MB)
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +5M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::Files over 5 MB committed:"; echo "$big"; exit 1
          fi
