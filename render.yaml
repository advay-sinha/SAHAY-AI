# Render Blueprint for the EXT-130 tester deployment (fictional data only).
# Text chat only: mock LLM, mock speech recognition, no speech synthesis.
# Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: sahay-backend
    runtime: python
    plan: free
    region: singapore
    # The backend imports the pure modules under ml/, so the build runs from the
    # repository root and installs only the pinned backend requirements (EXT-001).
    buildCommand: pip install -r backend/requirements.txt
    # Alembic is idempotent; running it on every start keeps the free plan
    # (which has no pre-deploy step) on the current schema.
    startCommand: >-
      cd backend &&
      python -m alembic upgrade head &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: demo
      - key: LLM_PROVIDER
        value: mock
      - key: ASR_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: none
      - key: ASSESSMENT_RUNNER
        value: local
      - key: POLICY_RETRIEVER
        value: local
      # PC-13 A: new victim sessions per client address per rolling hour.
      - key: SESSION_RATE_LIMIT_PER_HOUR
        value: "30"
      # Random 256-bit value generated by Render; the backend refuses to start
      # with the committed default or anything shorter than 32 characters.
      - key: SECRET_KEY
        generateValue: true
      # Supabase Session pooler URL (port 5432), entered in the dashboard.
      - key: DATABASE_URL
        sync: false
      # The Vercel origin, for example https://<project>.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
